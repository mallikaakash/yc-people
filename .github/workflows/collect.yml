name: Collect a YC year

on:
  workflow_dispatch:
    inputs:
      year:
        description: "YC year to collect in full, e.g. 2024"
        required: true
        type: number
      refresh:
        description: "Refresh all selected companies, including recently scanned ones"
        type: boolean
        default: false

concurrency:
  group: yc-directory
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      ready: ${{ steps.persist.outputs.ready }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test data integrity
        run: python -m unittest discover -s tests -v
      - name: Collect and render directory
        id: collect
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}
          YC_YEAR: ${{ inputs.year }}
          YC_REFRESH: ${{ inputs.refresh }}
        run: python scripts/collect_year.py
      - name: Save HTML download
        if: always() && steps.collect.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yc-directory
          path: docs/
          retention-days: 30
      - name: Commit database state and directory
        id: persist
        if: always() && steps.collect.outputs.ready == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "yc-directory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/directory.json docs/ DIRECTORY.md
          if ! git diff --cached --quiet; then
            git commit -m "Update YC directory [skip ci]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Prepare optional Pages artifact
        if: always() && vars.PUBLISH_PAGES == 'true' && steps.persist.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Report collection errors
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Collection had errors. Available state and HTML were preserved; inspect the run and company notes."
          exit 1

  deploy:
    if: always() && !cancelled() && needs.collect.outputs.ready == 'true' && vars.PUBLISH_PAGES == 'true'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy directory
        id: deployment
        uses: actions/deploy-pages@v4
